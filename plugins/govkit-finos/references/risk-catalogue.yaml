# FINOS AI Governance Framework risk catalogue, for /govkit-finos:risk-assess.
#
# Identifiers, titles, categories, status, mitigated_by (the inverse of each
# mitigation's `mitigates`), external_refs and related_risks are FINOS's, from
# the commit pinned in upstream/finos.lock.json. Content © FINOS, CC BY 4.0.
#
# summary and triggers are GovKit's: summary paraphrases the risk, and
# triggers are GovKit's judgement of which AI system features make the risk
# applicable (vocabulary in references/finos-model.md). They are a starting
# point for the applicability step, never a substitute for it.
#
# display_id is AIR-<category code>-<sequence>, as the FINOS site shows it.

version: "v2"
triggers:
  foundation-model: The system uses a generative or foundation model.
  hosted-model: The model is hosted by a third party and reached over an API.
  confidential-data: Personal, customer, confidential or regulated data reaches the model, its prompts or its stores.
  rag: The system retrieves from a knowledge base, vector store or search index.
  fine-tuning: The firm trains or fine-tunes a model on its own data.
  agentic: An agent chooses and calls tools or APIs that act on systems or data.
  mcp: Agents use Model Context Protocol servers.
  multi-agent: Several agents exchange messages, tasks or state.
  persistent-memory: An agent keeps memory or state across sessions.
  plugins: The system loads skills, plugins or extensions written by others.
  customer-facing: Customers or the public see outputs directly.
  decisions-about-people: Outputs inform decisions about individuals, such as credit, fraud, eligibility or pricing.
  regulated-activity: The system supports an activity a financial regulator supervises, such as advice, suitability, trading or reporting.
  generated-content: Generated text, code or media is published, sent or reused.
risks:
  - id: ri-1
    display_id: AIR-RC-001
    title: "Information Leaked To Hosted Model"
    category: Regulatory and compliance
    status: approved
    summary: "Data sent to a third-party hosted model for inference may be retained, exposed by the provider or extracted through attacks."
    triggers: [hosted-model, confidential-data]
    mitigated_by: [mi-1, mi-2, mi-4, mi-6, mi-7, mi-12, mi-15, mi-20]
    external_refs: { owasp-llm: [llm02-2026], eu-ai-act: [c3-s2-a10, c3-s2-a13, c5-s2-a53] }
    related_risks: [ri-2, ri-23]
    citation_url: https://air-governance-framework.finos.org/risks/ri-1_information-leaked-to-hosted-model.html
  - id: ri-2
    display_id: AIR-SEC-002
    title: "Information Leaked to Vector Store"
    category: Security
    status: approved
    summary: "Embeddings, vector stores, prompt logs and caches derived from sensitive data can leak it through inversion, inference or weak access control."
    triggers: [rag, confidential-data]
