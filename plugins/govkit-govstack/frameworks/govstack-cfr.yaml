    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality
  - id: quality-6
    group: Quality
    title: All end-user functionality is covered by functional tests, including both UI and API interactions
    intent: Every user-facing feature, through UI or API, has an automated functional test that runs in CI.
    obligation: recommended
    attributes: { ref: "govstack-cfr-quality#req-6", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality
  - id: quality-7
    group: Quality
    title: Compliance test mock/example implementation is provided
    intent: A standalone mock serves the OpenAPI endpoints with realistic payloads so third parties can run compliance tests.
    obligation: recommended
    attributes: { ref: "govstack-cfr-quality#req-7", mutability: replaceable, verification: observable }
    evidence_hints: [DLDR, DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality
  - id: quality-8
    group: Quality
    title: Building blocks are localizable
    intent: User-facing content can be presented in additional languages without changing application logic.
    obligation: recommended
    attributes: { ref: "govstack-cfr-quality#req-8", mutability: extensible, verification: auditable }
    evidence_hints: [REQ]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality

  # 6.5 Security — govstack-cfr-security
  - id: security-1
    group: Security
    title: Transport security is enforced
    intent: All traffic uses HTTPS with TLS 1.3 or later, insecure ciphers are off and no plaintext endpoint exists outside isolated local development.
    obligation: required
    attributes: { ref: "govstack-cfr-security#req-1", mutability: immutable, verification: observable }
    evidence_hints: [SECD]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.5-security
  - id: security-2
    group: Security
    title: Only up-to-date and industry-accepted cryptographic algorithms are used for data protection
    intent: Cryptography uses currently recommended algorithms, avoids deprecated ones, and can be reconfigured without code changes.
    obligation: recommended
    attributes: { ref: "govstack-cfr-security#req-2", mutability: immutable, verification: auditable }
    evidence_hints: [SECD]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.5-security
  - id: security-3
    group: Security
    title: Access control and authentication is enforced
    intent: Least-privilege access is enforced through standards-based identity and access management, with OpenID Connect for users and short-lived OAuth 2.0 or JWT tokens for services.
    obligation: required
    attributes: { ref: "govstack-cfr-security#req-3", mutability: extensible, verification: observable }
    evidence_hints: [SECD, HLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.5-security
  - id: security-4
    group: Security
    title: Secure configuration is used
    intent: Secrets reach the runtime through environment variables or a secret manager, never through source files or images.
    obligation: required
    attributes: { ref: "govstack-cfr-security#req-4", mutability: immutable, verification: auditable }
    evidence_hints: [SECD, DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.5-security
  - id: security-5
    group: Security
    title: No sensitive data such as keys, certificates or passwords is stored in code repositories or documentation
    intent: Repositories, documentation, pipelines and published artefacts contain no plaintext secrets, keys, certificates or real credentials.
    obligation: required
    attributes: { ref: "govstack-cfr-security#req-5", mutability: immutable, verification: auditable }
    evidence_hints: [SECD, CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.5-security
  - id: security-6
    group: Security
    title: Input and output sanitization is used
