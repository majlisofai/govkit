# GovStack core cross-functional requirements (govstack-cfr), as a GovKit framework.
#
# Installed into a repository's .govkit/frameworks/ by /govkit-govstack:apply.
# Every building-block specification inherits these requirements; a building
# block's own requirements come from /govkit-govstack:bb add <bb>.
#
# Classifiers map to GovKit fields:
#   REQUIRED / RECOMMENDED / DRAFT / DEPRECATED  -> obligation
#   IMMUTABLE / EXTENSIBLE / REPLACEABLE          -> attributes.mutability
#   OBSERVABLE / AUDITABLE                        -> attributes.verification
#   govstack-cfr-<category>#req-<n>               -> attributes.ref

id: govstack-cfr
kind: framework
name: GovStack Cross-Functional Requirements
version: "2.1.0"
publisher: GovStack (GovSpecs)
url: https://specs.govstack.global/architecture/6-cross-functional-requirements
document: GovStack Architecture Specification, section 6
type: standard
verified: 2026-10-24
text_policy: >
  Titles are GovStack's requirement titles. Intents are one-sentence paraphrases
  written for GovKit, not GovStack's requirement text; read the linked section
  for the authoritative wording. Version is the GovStack architecture
  specification release (2.1.0, 2026-03-13) that carries govstack-cfr.
related_govkit:
  overlay_commands: ["govkit-govstack:compliance"]
structure: [category]
controls:
  # 6.1 Development — govstack-cfr-development
  - id: development-1
    group: Development
    title: All application source code uses version control
    intent: Source, configuration and infrastructure definitions live in a distributed version control system with full, unrewritten history and traceable commits.
    obligation: required
    attributes: { ref: "govstack-cfr-development#req-1", mutability: extensible, verification: auditable }
    evidence_hints: [CDAU, DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-2
    group: Development
    title: All application source code and comments are clear, maintainable and written in English
    intent: Code, comments, commit messages and configuration are in English and follow a documented, consistent style guide.
    obligation: required
    attributes: { ref: "govstack-cfr-development#req-2", mutability: extensible, verification: auditable }
    evidence_hints: [CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-3
    group: Development
    title: All software is published with a clear open-source license
    intent: Each repository carries an OSI-approved licence at its root and dependency licences are checked for compatibility.
    obligation: recommended
    attributes: { ref: "govstack-cfr-development#req-3", mutability: extensible, verification: auditable }
    evidence_hints: [CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-4
    group: Development
    title: Database schema changes are managed with migration scripts
    intent: Every schema change is a versioned, re-runnable migration committed with the application code.
    obligation: recommended
    attributes: { ref: "govstack-cfr-development#req-4", mutability: extensible, verification: auditable }
    evidence_hints: [DATA, CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-5
    group: Development
    title: Include unit and integration test coverage
    intent: Automated unit and integration tests run unattended, give clear pass or fail results and meet a coverage threshold enforced in CI.
    obligation: recommended
    attributes: { ref: "govstack-cfr-development#req-5", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS, CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-6
    group: Development
    title: Regular security and code quality audits
    intent: Automated static, dependency and quality scans gate merges or releases above a severity threshold, and security-sensitive code gets expert peer review.
    obligation: recommended
    attributes: { ref: "govstack-cfr-development#req-6", mutability: extensible, verification: auditable }
    evidence_hints: [SECD, CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-7
    group: Development
    title: Used components End-of-Life is at least 5 years
    intent: No runtime, framework or library is adopted with a known or projected end of support under five years, and the timelines are documented.
    obligation: recommended
    attributes: { ref: "govstack-cfr-development#req-7", mutability: replaceable, verification: auditable }
    evidence_hints: [ADR, CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-8
    group: Development
    title: Preference for the top 25 languages listed in either the TIOBE Index or any of the three IEEE Spectrum rankings
    intent: Core logic is written in a widely used language so that maintainers and auditors can be found, including in low-resource settings.
    obligation: recommended
    attributes: { ref: "govstack-cfr-development#req-8", mutability: replaceable, verification: auditable }
    evidence_hints: [ADR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development
  - id: development-9
    group: Development
    title: Best practices for Public Code are followed
    intent: Development follows the Standard for Public Code and the team periodically self-assesses against its checklist.
    obligation: recommended
    attributes: { ref: "govstack-cfr-development#req-9", mutability: extensible, verification: auditable }
    evidence_hints: [CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.1-development

  # 6.2 Deployment — govstack-cfr-deployment
  - id: deployment-1
    group: Deployment
    title: Building blocks are deployable as a container
    intent: The building block ships as a self-contained, semantically versioned container image that anyone can rebuild reproducibly from the repository.
    obligation: required
    attributes: { ref: "govstack-cfr-deployment#req-1", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS, OPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-2
    group: Deployment
    title: Backup and restore-capable
    intent: A documented, tested procedure backs up and restores all persistent state, including keys, to a working clean instance.
    obligation: required
    attributes: { ref: "govstack-cfr-deployment#req-2", mutability: extensible, verification: auditable }
    evidence_hints: [OPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-3
    group: Deployment
    title: Include deployment documentation
    intent: Current deployment instructions in the repository cover prerequisites, every setting, startup checks, manual steps and rollback.
    obligation: required
    attributes: { ref: "govstack-cfr-deployment#req-3", mutability: extensible, verification: auditable }
    evidence_hints: [OPS, DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-4
    group: Deployment
    title: Verify container image integrity before deployment
    intent: Images are signed and verified, and only trusted registries feed staging and production.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-4", mutability: extensible, verification: auditable }
    evidence_hints: [SECD, DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-5
    group: Deployment
    title: Versioning and rollback-capable
    intent: Operators can tell which release runs and revert it, including schema changes, using retained release artefacts and a documented procedure.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-5", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS, OPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-6
    group: Deployment
    title: Multi-environment support
    intent: Development, test and production differ only by externalised configuration, with per-environment feature toggles.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-6", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-7
    group: Deployment
    title: Include all deployment scripts
    intent: Idempotent, preferably declarative deployment, scaling and rollback scripts for each environment live in the building block's repository.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-7", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-8
    group: Deployment
    title: Continuous integration and continuous deployment compatibility
    intent: Build, test, verification, promotion and rollback run in standard CI/CD pipelines without manual steps.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-8", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-9
    group: Deployment
    title: High availability and scalability
    intent: Disposable instances scale horizontally and recover automatically without tying the deployment to one cloud provider, and any non-scalable component is documented.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-9", mutability: extensible, verification: auditable }
    evidence_hints: [HLDR, OPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-10
    group: Deployment
    title: Containers support graceful shutdown and fast startup
    intent: Containers finish in-flight work and release resources on a termination signal, and become ready fast enough for rolling updates.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-10", mutability: extensible, verification: auditable }
    evidence_hints: [DEVOPS, OPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-11
    group: Deployment
    title: Resource limits are declared in deployment artifacts
    intent: Every manifest declares tested CPU, memory and any specialised resource requests and limits.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-11", mutability: extensible, verification: observable }
    evidence_hints: [DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment
  - id: deployment-12
    group: Deployment
    title: Container images use minimal base images
    intent: Images hold only runtime dependencies, and any shell, compiler or package manager that remains is justified.
    obligation: recommended
    attributes: { ref: "govstack-cfr-deployment#req-12", mutability: extensible, verification: auditable }
    evidence_hints: [SECD, DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.2-deployment

  # 6.3 Architecture — govstack-cfr-architecture
  - id: architecture-1
    group: Architecture
    title: Building Blocks are autonomous
    intent: Each building block runs on its own, owns its data and shares no database, file system or memory with another building block.
    obligation: required
    attributes: { ref: "govstack-cfr-architecture#req-1", mutability: immutable, verification: auditable }
    evidence_hints: [HLDR, ADR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-2
    group: Architecture
    title: Communicate with other Building Blocks only via API
    intent: Building blocks exchange data and functions only through externalisable service interfaces over the network, never through back doors.
    obligation: required
    attributes: { ref: "govstack-cfr-architecture#req-2", mutability: replaceable, verification: auditable }
    evidence_hints: [HLDR, DLDR, DFD]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-3
    group: Architecture
    title: APIs are versioned
    intent: APIs carry semantic versions in the path or header, and breaking changes get a new versioned endpoint.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-3", mutability: extensible, verification: observable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-4
    group: Architecture
    title: APIs are stateless
    intent: Every call carries all the context it needs, and the server keeps no session state between requests.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-4", mutability: extensible, verification: auditable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-5
    group: Architecture
    title: HTTP methods follow idempotency
    intent: Safe and idempotent HTTP methods behave as RFC 9110 defines, so repeated calls cause no additional side effects.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-5", mutability: extensible, verification: observable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-6
    group: Architecture
    title: Follows REST API Design Guidelines Part 1
    intent: APIs follow the core TM Forum REST design principles, including no personal data or session keys in URLs and self-descriptive messages.
    obligation: required
    attributes: { ref: "govstack-cfr-architecture#req-6", mutability: extensible, verification: auditable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-7
    group: Architecture
    title: Follows REST API Design Guidelines Parts 2-7
    intent: APIs follow the extended TM Forum REST guidelines, and any documented deviation still gives a consistent contract.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-7", mutability: replaceable, verification: auditable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-8
    group: Architecture
    title: User interface and service logic is logically separated
    intent: The user interface reaches the backend only through APIs and holds no business rules or direct data access.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-8", mutability: extensible, verification: auditable }
    evidence_hints: [HLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-9
    group: Architecture
    title: Databases do not include business logic
    intent: Business rules live in versioned, tested application code rather than in triggers or stored procedures.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-9", mutability: extensible, verification: auditable }
    evidence_hints: [DLDR, DATA]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-10
    group: Architecture
    title: Domain Driven Design (DDD) and microservices architectural principles guide the design of components
    intent: Services are drawn around bounded business domains that own their data and deploy independently.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-10", mutability: extensible, verification: auditable }
    evidence_hints: [HLDR, ADR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-11
    group: Architecture
    title: Designed for asynchronous first
    intent: The design defaults to asynchronous patterns such as publish/subscribe so it tolerates poor connectivity and unavailable peers.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-11", mutability: extensible, verification: auditable }
    evidence_hints: [HLDR, ADR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-12
    group: Architecture
    title: Application is resilient to external system failures
    intent: Retries, circuit breakers and fallbacks stop a failing dependency from cascading beyond the use cases that need it.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-12", mutability: extensible, verification: auditable }
    evidence_hints: [HLDR, DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-13
    group: Architecture
    title: Include Transaction/Trace/Correlation IDs
    intent: A correlation ID created at the entry point travels unchanged through every downstream call for end-to-end tracing.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-13", mutability: extensible, verification: observable }
    evidence_hints: [DLDR, OPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-14
    group: Architecture
    title: Use Web Hooks for callbacks
    intent: Event and completion notifications to other systems use webhooks registered by the subscriber.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-14", mutability: replaceable, verification: observable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-15
    group: Architecture
    title: Observability and monitoring functionality is implemented
    intent: Health checks, metrics and logs are exposed in forms that standard monitoring platforms consume.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-15", mutability: extensible, verification: observable }
    evidence_hints: [OPS, DEVOPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-16
    group: Architecture
    title: Use NTP synchronization
    intent: Clocks are synchronised where precise timestamps matter for ordering, logs, tokens and audit.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-16", mutability: replaceable, verification: auditable }
    evidence_hints: [OPS]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-17
    group: Architecture
    title: APIs follow a published deprecation lifecycle
    intent: Retiring endpoints are announced with a timeline and machine-readable signals, and keep working through a transition period.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-17", mutability: extensible, verification: auditable }
    evidence_hints: [DLDR, ADR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-18
    group: Architecture
    title: Consumers apply the tolerant reader pattern to received payloads
    intent: Consumers ignore unknown fields in payloads so producers can add fields without breaking them.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-18", mutability: extensible, verification: auditable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture
  - id: architecture-19
    group: Architecture
    title: Asynchronous messages and events follow a published schema
    intent: Every asynchronous message or event has a published, versioned schema available to consumers before integration.
    obligation: recommended
    attributes: { ref: "govstack-cfr-architecture#req-19", mutability: extensible, verification: auditable }
    evidence_hints: [DLDR, DATA]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.3-architecture

  # 6.4 Quality — govstack-cfr-quality
  - id: quality-1
    group: Quality
    title: English documentation is provided
    intent: English installation, configuration and operating documentation is kept with the source code.
    obligation: required
    attributes: { ref: "govstack-cfr-quality#req-1", mutability: extensible, verification: auditable }
    evidence_hints: [OPS, CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality
  - id: quality-2
