    evidence_hints: [CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality
  - id: quality-3
    group: Quality
    title: Applications meet the accessibility requirements of WCAG 2.1 at the AA level
    intent: User-facing applications conform to WCAG 2.1 AA, verified by automated scans and structured manual testing.
    obligation: recommended
    attributes: { ref: "govstack-cfr-quality#req-3", mutability: immutable, verification: observable }
    evidence_hints: [REQ, CDAU]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality
  - id: quality-4
    group: Quality
    title: OpenAPI specification is provided
    intent: Every external endpoint is described in a valid OpenAPI 3.x document that integrators can rely on.
    obligation: recommended
    attributes: { ref: "govstack-cfr-quality#req-4", mutability: extensible, verification: observable }
    evidence_hints: [DLDR]
    citation_url: https://specs.govstack.global/architecture/6-cross-functional-requirements/6.4-quality
  - id: quality-5
    group: Quality
    title: Functional scope of the system is defined and documented in clear business use cases and user stories
    intent: Use cases and user stories set the boundary of what the building block does and therefore what must be tested.
    obligation: recommended
    attributes: { ref: "govstack-cfr-quality#req-5", mutability: extensible, verification: auditable }
