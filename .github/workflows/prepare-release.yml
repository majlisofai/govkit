name: Prepare release

# Bump one plugin's version and open a release PR with a CHANGELOG.md stub.
# Fill in the stub on the PR branch, then merge: the Release workflow tags and
# publishes it. CI fails while the stub is unfilled. Add new modules to the
# plugin choices below.
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        type: choice
        options:
          - govkit
          - govkit-govstack
        default: govkit
      bump:
        description: patch, minor, major or an exact X.Y.Z (0.x stays beta; 1.0.0 is the first stable release)
        required: true
        default: minor

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump version
        id: bump
        env:
          PLUGIN: ${{ inputs.plugin }}
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/release.mjs bump "$PLUGIN" "$BUMP"
          version=$(node -p "require('./.claude-plugin/marketplace.json').plugins.find((p) => p.name === process.env.PLUGIN).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/${{ inputs.plugin }}-${{ steps.bump.outputs.version }}
          title: "chore(release): ${{ inputs.plugin }} ${{ steps.bump.outputs.version }}"
          commit-message: "chore(release): ${{ inputs.plugin }} ${{ steps.bump.outputs.version }}"
          labels: release
          body: |
            Bumps `${{ inputs.plugin }}` to `${{ steps.bump.outputs.version }}`.

            Before merging:

            - Replace the `TODO` stub at the top of `CHANGELOG.md` with the changes. `node scripts/release.mjs check` fails until you do.
            - Run every check locally. PRs opened by this workflow don't trigger CI. A GovKit bump may fall outside a module's `govkit.max_exclusive`; widen it in this PR if the module still works.

            Merging publishes the tag `${{ inputs.plugin }}--v${{ steps.bump.outputs.version }}` and its GitHub release.
