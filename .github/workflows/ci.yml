name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Vendored ArcKit files untouched
        run: node scripts/sync-arckit.mjs --check
      - name: Compatible with locked ArcKit release
        run: node scripts/check-compat.mjs
      - name: Content valid
        run: python3 scripts/validate-content.py
      - name: Release metadata
        run: node scripts/release.mjs check
      - name: Tests
        run: node --test tests/
